<div class="f">
  <label for="urlVideo">Vídeo demonstrativo (URL)</label>
  <div class="extra-linha">
    <input
      id="urlVideo"
      type="url"
      placeholder="https://"
      [ngModel]="url()"
      (ngModelChange)="url.set($event)"
      (keydown.enter)="$event.preventDefault(); adicionarVideo()"
    />
    <button
      class="sbtn sm"
      type="button"
      (click)="adicionarVideo()"
      [disabled]="!url().trim() || estado.ocupado()"
    >
      Adicionar
    </button>
  </div>
  @for (video of estado.videos(); track video.chave) {
    <div class="extra-item">
      <a [href]="video.src" target="_blank" rel="noopener">{{ video.src }}</a>
      <button class="sbtn sm" type="button" (click)="excluir(video)" aria-label="Excluir vídeo">
        ✕
      </button>
    </div>
  }
</div>

<div class="f">
  <label>Manual em PDF</label>
  <label class="up">
    Arraste um arquivo ou clique<small>Arquivo até 20 MB</small>
    <input type="file" hidden accept=".pdf,application/pdf" (change)="aoEscolherManual($event)" />
  </label>
  @for (manual of estado.manuais(); track manual.chave) {
    <div class="extra-item">
      <a [href]="manual.src" target="_blank" rel="noopener">{{
        manual.nomeArquivo ?? 'Manual PDF'
      }}</a>
      <button class="sbtn sm" type="button" (click)="excluir(manual)" aria-label="Excluir manual">
        ✕
      </button>
    </div>
  }
</div>

@if (erro(); as e) {
  <span class="warn full">{{ e }}</span>
}
