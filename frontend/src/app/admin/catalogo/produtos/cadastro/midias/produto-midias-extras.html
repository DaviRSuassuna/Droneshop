<div class="f">
  <label for="urlVideo">Vídeo demonstrativo (URL)</label>
  <div class="extra-linha">
    <input
      id="urlVideo"
      type="url"
      placeholder="https://"
      [ngModel]="url()"
      (ngModelChange)="url.set($event)"
      (keydown.enter)="$event.preventDefault(); adicionarVideo()"
    />
    <button
      class="btn sm"
      type="button"
      (click)="adicionarVideo()"
      [disabled]="!url().trim() || estado.ocupado()"
    >
      Adicionar
    </button>
  </div>
  @for (video of estado.videos(); track video.chave) {
    <div class="extra-item">
      <a [href]="video.src" target="_blank" rel="noopener">{{ video.src }}</a>
      <button class="btn sm" type="button" (click)="excluir(video)" aria-label="Excluir vídeo">
        ✕
      </button>
    </div>
  }
</div>

<div class="f">
  <label>Manual em PDF</label>
  <label
    class="up"
    tabindex="0"
    role="button"
    aria-label="Adicionar manual em PDF"
    (keydown.enter)="manualArquivo.click()"
    (keydown.space)="$event.preventDefault(); manualArquivo.click()"
    ><div class="mini" aria-hidden="true"><span>+</span></div>
    Clique para selecionar<small>Arquivo PDF até 20 MB</small>
    <input
      #manualArquivo
      type="file"
      hidden
      accept=".pdf,application/pdf"
      (change)="aoEscolherManual($event)"
    />
  </label>
  @for (manual of estado.manuais(); track manual.chave) {
    <div class="extra-item">
      <a [href]="manual.src" target="_blank" rel="noopener">{{
        manual.nomeArquivo ?? 'Manual PDF'
      }}</a>
      @if (manual.id) {
        <a class="btn sm" [href]="manual.src + '?download=true'" download aria-label="Baixar manual"
          >Baixar</a
        >
      }
      <button class="btn sm" type="button" (click)="excluir(manual)" aria-label="Excluir manual">
        ✕
      </button>
    </div>
  }
</div>

@if (erro(); as e) {
  <span class="erro w6" role="alert">{{ e }}</span>
}
