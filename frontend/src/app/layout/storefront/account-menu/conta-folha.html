<dialog
  #folha
  class="cs"
  aria-label="Minha conta"
  (click)="aoClicar($event)"
  (cancel)="aoCancelar($event)"
  (touchstart)="aoTocar($event)"
  (touchmove)="aoArrastar($event)"
>
  <button class="bar" type="button" aria-label="Fechar" (click)="fechar()"></button>
  @if (conta(); as c) {
    <div class="quem">
      <span class="av" aria-hidden="true">{{ avatar() }}</span>
      <div>
        <b>{{ c.nome }}</b>
        @if (c.detalhe) {
          <small>{{ c.detalhe }}</small>
        }
      </div>
    </div>
  }
  @for (item of areas; track item.area) {
    <a [routerLink]="item.rota" routerLinkActive ariaCurrentWhenActive="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        @switch (item.area) {
          @case ('pedidos') {
            <path d="M4 7h16l-1.5 12h-13z" />
            <path d="M8 7V5a4 4 0 0 1 8 0v2" />
          }
          @case ('perfil') {
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" />
          }
          @case ('favoritos') {
            <path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z" />
          }
          @case ('enderecos') {
            <path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z" />
            <circle cx="12" cy="9" r="2.5" />
          }
          @case ('pagamentos') {
            <rect x="3" y="6" width="18" height="13" rx="2" />
            <path d="M3 10h18" />
          }
        }
      </svg>
      {{ item.nome }}
      <span class="d">
        @if (contagem(item.area); as n) {
          <em>{{ n }}</em>
        }
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
      </span>
    </a>
  }
  <button class="sair" type="button" (click)="sairDaConta()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 12H4M8 8l-4 4 4 4M14 4h5v16h-5" /></svg>
    Sair da conta
  </button>
</dialog>
