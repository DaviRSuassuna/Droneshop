<header class="tb">
  <div class="in gut">
    <a class="brand" routerLink="/admin">AERIA <span>ADMIN</span></a>
    <nav class="tabs" aria-label="Painel">
      @for (item of itens; track item.rota) {
        <a
          [routerLink]="item.rota"
          routerLinkActive
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: !!item.exata }"
          >{{ item.rotulo }}</a
        >
      }
    </nav>
    <div class="r">
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        Buscar no painel<kbd>/</kbd>
      </div>
      <span class="avatar" title="Usuário do painel">DR</span>
    </div>
  </div>
  <nav class="mnav" aria-label="Painel (celular)">
    @for (item of itens; track item.rota) {
      <a
        [routerLink]="item.rota"
        routerLinkActive
        ariaCurrentWhenActive="page"
        [routerLinkActiveOptions]="{ exact: !!item.exata }"
        >{{ item.rotulo }}</a
      >
    }
  </nav>
</header>
