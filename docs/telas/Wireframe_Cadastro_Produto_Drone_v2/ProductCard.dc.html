<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="{{ href }}" style="display:flex;flex-direction:column;background:#101012;border:1px solid rgba(255,255,255,.07);border-radius:10px;overflow:hidden;text-decoration:none" style-hover="border-color:rgba(255,255,255,.20)">
  <div style="position:relative;height:190px;background:repeating-linear-gradient(135deg,#151518 0 7px,#0E0E11 7px 14px);display:flex;align-items:center;justify-content:center">
    <span style="padding:5px 9px;background:rgba(10,10,10,.72);border-radius:4px;font:400 10px/1 ui-monospace,Menlo,monospace;color:#8A8A8F">foto do produto · fundo estúdio</span>
    <sc-if value="{{ badge }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute;top:12px;left:12px;padding:4px 9px;border-radius:20px;background:#3B7AF0;font:500 10px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#FFFFFF">{{ badge }}</span>
    </sc-if>
  </div>
  <div style="display:flex;flex-direction:column;gap:9px;padding:16px 16px 18px">
    <span style="font:300 15px/1.2 'Sora','Helvetica Neue',Helvetica,Arial,sans-serif;color:#F5F5F7">{{ title }}</span>
    <span style="font:300 11.5px/1.4 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#7C7C82">{{ tagline }}</span>
    <div style="display:flex;align-items:baseline;gap:9px;margin-top:4px">
      <span style="font:300 16px/1 'Sora','Helvetica Neue',Helvetica,Arial,sans-serif;color:#FFFFFF">{{ price }}</span>
      <sc-if value="{{ oldPrice }}" hint-placeholder-val="{{ false }}">
        <span style="font:300 11.5px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#5E5E64;text-decoration:line-through">{{ oldPrice }}</span>
      </sc-if>
    </div>
    <span style="font:300 11px/1.3 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#6E6E73">{{ installments }}</span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:330},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Falcon X2 Pro&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;43 min · 15 km · 4K 60fps&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;R$ 12.499&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;oldPrice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;installments&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12× de R$ 1.041 sem juros&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Storefront.dc.html#1d&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
