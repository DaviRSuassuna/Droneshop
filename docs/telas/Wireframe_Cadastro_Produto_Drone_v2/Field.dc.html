<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isHead }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;align-items:center;gap:12px;padding-top:10px">
    <span style="font:500 10px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7C7C82">{{ label }}</span>
    <span style="flex:1;height:1px;background:rgba(255,255,255,.07)"></span>
  </div>
</sc-if>
<sc-if value="{{ isText }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;flex-direction:column;gap:7px">
    <div style="display:flex;align-items:baseline;gap:3px">
      <span style="font:300 12px/1.3 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#C9C9CE;letter-spacing:.01em">{{ label }}</span>
      <sc-if value="{{ req }}" hint-placeholder-val="{{ false }}"><span style="font:500 13px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#FF6B4A">*</span></sc-if>
    </div>
    <div style="display:flex;align-items:center;height:38px;padding:0 12px;background:#0C0C0E;border:1px solid rgba(255,255,255,.10);border-radius:6px">
      <span style="font:300 12.5px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#66666C;letter-spacing:.01em">{{ ph }}</span>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isSelect }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:7px">
    <div style="display:flex;align-items:baseline;gap:3px">
      <span style="font:300 12px/1.3 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#C9C9CE;letter-spacing:.01em">{{ label }}</span>
      <sc-if value="{{ req }}" hint-placeholder-val="{{ false }}"><span style="font:500 13px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#FF6B4A">*</span></sc-if>
    </div>
    <div style="display:flex;align-items:center;justify-content:space-between;height:38px;padding:0 12px;background:#0C0C0E;border:1px solid rgba(255,255,255,.10);border-radius:6px">
      <span style="font:300 12.5px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#66666C;letter-spacing:.01em">{{ ph }}</span>
      <span style="font:400 10px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#8A8A8F">▾</span>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isArea }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:7px">
    <div style="display:flex;align-items:baseline;gap:3px">
      <span style="font:300 12px/1.3 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#C9C9CE;letter-spacing:.01em">{{ label }}</span>
      <sc-if value="{{ req }}" hint-placeholder-val="{{ false }}"><span style="font:500 13px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#FF6B4A">*</span></sc-if>
    </div>
    <div style="height:96px;padding:11px 12px;background:#0C0C0E;border:1px solid rgba(255,255,255,.10);border-radius:6px">
      <span style="font:300 12.5px/1.6 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#66666C;letter-spacing:.01em">{{ ph }}</span>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isUpload }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;flex-direction:column;gap:7px">
    <div style="display:flex;align-items:baseline;gap:3px">
      <span style="font:300 12px/1.3 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#C9C9CE;letter-spacing:.01em">{{ label }}</span>
      <sc-if value="{{ req }}" hint-placeholder-val="{{ false }}"><span style="font:500 13px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#FF6B4A">*</span></sc-if>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:104px;background:#0C0C0E;border:1px dashed rgba(255,255,255,.16);border-radius:6px">
      <span style="font:300 12px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#9A9AA0">Arraste um arquivo ou clique</span>
      <span style="font:300 10.5px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#5E5E64">{{ ph }}</span>
    </div>
  </div>
</sc-if>
<sc-if value="{{ isCheck }}" hint-placeholder-val="{{ false }}">
  <div style="display:flex;align-items:center;gap:10px;height:38px">
    <span style="width:15px;height:15px;border:1px solid rgba(255,255,255,.22);border-radius:3px;background:#0C0C0E"></span>
    <span style="font:300 12.5px/1.3 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#C9C9CE;letter-spacing:.01em">{{ label }}</span>
    <sc-if value="{{ req }}" hint-placeholder-val="{{ false }}"><span style="font:500 13px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#FF6B4A">*</span></sc-if>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:90},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Campo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ph&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;req&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isHead&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isText&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isSelect&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isArea&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isUpload&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;isCheck&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}"></script>
</body>
</html>
