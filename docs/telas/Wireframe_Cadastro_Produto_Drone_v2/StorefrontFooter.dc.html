<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border-top:1px solid rgba(255,255,255,.07);padding:44px 34px 26px;background:#0A0A0A">
  <div style="display:grid;grid-template-columns:minmax(0,1.4fr) repeat(4,minmax(0,1fr));gap:32px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <span style="font:300 16px/1 'Sora','Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.28em;color:#FFFFFF">AERIA</span>
      <span style="font:300 12px/1.6 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#6E6E73;max-width:230px">Drones profissionais, compactos e agrícolas. Envio para todo o Brasil.</span>
    </div>
    <sc-for list="{{ columns }}" as="c" hint-placeholder-count="4">
      <div style="display:flex;flex-direction:column;gap:11px">
        <span style="font:500 10px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7C7C82">{{ c.title }}</span>
        <sc-for list="{{ c.links }}" as="l" hint-placeholder-count="4">
          <a href="{{ l.href }}" style="font:300 12px/1.3 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#9A9AA0;text-decoration:none">{{ l.label }}</a>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:34px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06)">
    <span style="font:300 11px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#5E5E64">© 2026 Aeria Drones · CNPJ 00.000.000/0001-00</span>
    <span style="font:300 11px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#5E5E64">Pix · Boleto · Cartão em até 12×</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:280}}">
class Component extends DCLogic {
  renderVals() {
    const L = (label, href) => ({ label, href });
    return {
      columns: [
        { title: "Loja", links: [L("Drones", "Storefront.dc.html#1c"), L("Acessórios", "Storefront.dc.html#1c"), L("Ofertas", "Storefront.dc.html#1c"), L("Lançamentos", "Storefront.dc.html#1a")] },
        { title: "Conta", links: [L("Entrar", "Storefront.dc.html#1b"), L("Criar conta", "Storefront.dc.html#1b"), L("Meus pedidos", "Storefront.dc.html#1b"), L("Lista de desejos", "Storefront.dc.html#1b")] },
        { title: "Suporte", links: [L("Central de ajuda", "Storefront.dc.html#1a"), L("Trocas e devoluções", "Storefront.dc.html#1a"), L("Garantia", "Storefront.dc.html#1a"), L("Regras ANAC", "Storefront.dc.html#1a")] },
        { title: "Empresa", links: [L("Sobre a Aeria", "Storefront.dc.html#1a"), L("Vendas corporativas", "Storefront.dc.html#1c"), L("Seja revendedor", "Storefront.dc.html#1a"), L("Painel admin", "Admin.dc.html#2d")] }
      ]
    };
  }
}
</script>
</body>
</html>
