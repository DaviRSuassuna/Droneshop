<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:24px;height:52px;padding:0 24px;background:#0A0A0A;border-bottom:1px solid rgba(255,255,255,.09)">
  <div style="display:flex;align-items:center;gap:26px">
    <span style="padding:4px 8px;border:1px solid rgba(255,255,255,.18);border-radius:5px;font:500 10px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;color:#F5F5F7">ADMIN</span>
    <div style="display:flex;align-items:center;gap:20px">
      <sc-for list="{{ items }}" as="i" hint-placeholder-count="6">
        <a href="{{ i.href }}" style="font:300 12.5px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:{{ i.fg }};text-decoration:none;padding:16px 0;border-bottom:2px solid {{ i.bd }}">{{ i.label }}</a>
      </sc-for>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:14px">
    <div style="display:flex;align-items:center;width:210px;height:32px;padding:0 11px;background:#0C0C0E;border:1px solid rgba(255,255,255,.10);border-radius:6px">
      <span style="font:300 11.5px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#66666C">Buscar no painel</span>
    </div>
    <a href="Storefront.dc.html" style="font:300 11.5px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#9A9AA0;text-decoration:none">Ver loja ↗</a>
    <span style="width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;font:400 10.5px/1 ui-monospace,Menlo,monospace;color:#C9C9CE">MR</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:60},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dashboard&quot;,&quot;Produtos&quot;,&quot;Marcas&quot;,&quot;Categorias&quot;,&quot;Pedidos&quot;,&quot;Usuários&quot;],&quot;default&quot;:&quot;Produtos&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "";
    const defs = [
      ["Dashboard", "Admin.dc.html#2d"],
      ["Produtos", "Admin.dc.html#1a"],
      ["Marcas", "Admin.dc.html#1b"],
      ["Categorias", "Admin.dc.html#1c"],
      ["Pedidos", "Admin.dc.html#2b"],
      ["Usuários", "Admin.dc.html#2a"]
    ];
    return {
      items: defs.map(([label, href]) => ({
        label, href,
        fg: label === active ? "#F5F5F7" : "#8A8A8F",
        bd: label === active ? "#FFFFFF" : "transparent"
      }))
    };
  }
}
</script>
</body>
</html>
