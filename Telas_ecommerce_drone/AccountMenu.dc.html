<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:22px">
  <div style="display:flex;align-items:center;gap:13px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.07)">
    <span style="display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.08);font:400 12px/1 ui-monospace,Menlo,monospace;color:#C9C9CE">MR</span>
    <span style="display:flex;flex-direction:column;gap:4px">
      <span style="font:300 13px/1.2 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#F5F5F7">Marina Ribeiro</span>
      <span style="font:300 11px/1.2 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#6E6E73">Cliente desde 2024</span>
    </span>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="4">
      <a href="{{ i.href }}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:6px;background:{{ i.bg }};font:300 12.5px/1.2 'Helvetica Neue',Helvetica,Arial,sans-serif;color:{{ i.fg }};text-decoration:none">
        <span>{{ i.label }}</span>
        <span style="font:400 10px/1 ui-monospace,Menlo,monospace;color:#5E5E64">{{ i.meta }}</span>
      </a>
    </sc-for>
  </div>
  <a href="Storefront.dc.html#1b" style="padding:10px 12px;font:300 12px/1.2 'Helvetica Neue',Helvetica,Arial,sans-serif;color:#6E6E73;text-decoration:none;border-top:1px solid rgba(255,255,255,.07)">Sair da conta</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:320},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Meus pedidos&quot;,&quot;Perfil e dados&quot;,&quot;Lista de desejos&quot;,&quot;Endereços&quot;,&quot;Meios de pagamento&quot;],&quot;default&quot;:&quot;Perfil e dados&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "";
    const defs = [
      ["Meus pedidos", "Storefront.dc.html#3b", "12"],
      ["Perfil e dados", "Storefront.dc.html#3a", ""],
      ["Lista de desejos", "Storefront.dc.html#3c", "6"],
      ["Endereços", "Storefront.dc.html#3a", "2"],
      ["Meios de pagamento", "Storefront.dc.html#3a", "2"]
    ];
    return {
      items: defs.map(([label, href, meta]) => ({
        label, href, meta,
        bg: label === active ? "rgba(255,255,255,.07)" : "transparent",
        fg: label === active ? "#F5F5F7" : "#8A8A8F"
      }))
    };
  }
}
</script>
</body>
</html>
