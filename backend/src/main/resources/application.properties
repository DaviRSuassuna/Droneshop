# Datasource - PostgreSQL
# dev e prod usam o Postgres do compose.yaml. O %test nao tem URL fixa:
# - local: Dev Services sobe um Postgres 16 descartavel (precisa de Docker);
# - CI: o workflow passa QUARKUS_DATASOURCE_JDBC_URL/USERNAME/PASSWORD do
#   Postgres do proprio job e desliga o Dev Services.
# Mídias no armazenamento S3 (D42, #95): RustFS do compose.yaml; para a AWS, troque endpoint,
# região e credenciais pelas variáveis. Os padrões são só do RustFS local, sem segredo real.
aeria.s3.bucket=${AERIA_S3_BUCKET:aeria-midias}
quarkus.s3.endpoint-override=${AERIA_S3_ENDPOINT:http://localhost:9000}
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=${AERIA_S3_REGION:us-east-1}
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${AERIA_S3_ACCESS_KEY:rustfsadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${AERIA_S3_SECRET_KEY:rustfsadmin}
quarkus.s3.sync-client.type=url
# testes usam o falso em memória (testes/ArmazenamentoMemoria), sem container de S3
quarkus.s3.devservices.enabled=false
quarkus.http.limits.max-body-size=21M
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.username=droneshop_user
%dev,prod.quarkus.datasource.password=123456
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/droneshopdb
%test.quarkus.datasource.devservices.image-name=docker.io/postgres:16

# JWT (a chave de produção deve ser fornecida pelo ambiente; chaves de dev são geradas localmente)
mp.jwt.verify.issuer=droneshop-api
%dev.mp.jwt.verify.publickey.location=file:${user.dir}/target/jwt-dev/publicKey.pem
%dev.smallrye.jwt.sign.key.location=file:${user.dir}/target/jwt-dev/privateKey.pem
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY}

# Hibernate ORM - schema gerado a partir das entidades
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Autenticacao so nas rotas protegidas: token invalido vira AuthenticationFailedException
# no JAX-RS e sai em Problem (AuthenticationFailedExceptionMapper)
quarkus.http.auth.proactive=false

# CORS - Angular dev server consumindo a API
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4210
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Authorization, Content-Disposition
quarkus.http.cors.access-control-max-age=24H

# base url para o type em exception (Problem/RFC 7807)
%dev.problem.base-url=http://localhost:8080
%test.problem.base-url=http://localhost:8080
# %prod.problem.base-url=https://api.seudominio.com

# Carga de dados no dev/test: localidades (IBGE) antes do import.sql,
# porque os fornecedores do import.sql apontam para municipios
%dev.quarkus.hibernate-orm.sql-load-script=localidades.sql,import.sql,import-b.sql,import-a.sql
%test.quarkus.hibernate-orm.sql-load-script=localidades.sql,import.sql,import-b.sql,import-a.sql

# ViaCEP (REST Client endereco/client/ViaCepClient) - timeouts curtos:
# se o ViaCEP cair, a API responde 503 e o cadastro segue com preenchimento manual
quarkus.rest-client.viacep.url=https://viacep.com.br
quarkus.rest-client.viacep.connect-timeout=2000
quarkus.rest-client.viacep.read-timeout=3000
# nos testes o REST Client fala com o ViaCEP falso (src/test/.../endereco/ViaCepFalso.java)
%test.quarkus.rest-client.viacep.url=http://localhost:${quarkus.http.test-port:8081}/viacep-falso

# Demais integrações nos testes (D34): cada REST Client aponta para um falso em
# src/test, criado junto com os testes das issues (#27, #30, #32, #47)
%test.quarkus.rest-client.mercadopago.url=http://localhost:${quarkus.http.test-port:8081}/mercadopago-falso
%test.quarkus.rest-client.frete.url=http://localhost:${quarkus.http.test-port:8081}/frete-falso
%test.quarkus.rest-client.resend.url=http://localhost:${quarkus.http.test-port:8081}/resend-falso
%test.quarkus.rest-client.google.url=http://localhost:${quarkus.http.test-port:8081}/google-falso

# Rotinas agendadas desligadas nos testes: rodam por POST /admin/rotinas/{nome} (D33)
%test.quarkus.scheduler.enabled=false

# Arquivos de mídia enviados nos testes (#12, D29)

# Logging
quarkus.log.level=INFO
quarkus.log.category."br.com.droneshop".level=DEBUG
