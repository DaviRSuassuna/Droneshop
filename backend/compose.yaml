services:
  keycloak:
    build: ./keycloak
    command: start-dev --import-realm
    environment:
      AERIA_KEYCLOAK_CLIENT_SECRET: ${AERIA_KEYCLOAK_CLIENT_SECRET:-aeria-dev}
      AERIA_SMTP_HOST: ${AERIA_SMTP_HOST:-mailpit}
      AERIA_SMTP_PORT: ${AERIA_SMTP_PORT:-1025}
      AERIA_SMTP_FROM: ${AERIA_SMTP_FROM:-contato@aeria.invalid}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/aeria-realm.json:/opt/keycloak/data/import/aeria-realm.json:ro
    depends_on:
      - mailpit

  mailpit:
    image: docker.io/axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"

  postgres:
    image: docker.io/postgres:16
    container_name: droneshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: droneshopdb
      POSTGRES_USER: droneshop_user
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5432:5432"
    volumes:
      - droneshop-postgres-data:/var/lib/postgresql/data

  # Banco da trilha B (docs/agentes/README.md): o dev recria o schema a cada subida,
  # então cada trilha precisa do próprio banco.
  postgres-b:
    image: docker.io/postgres:16
    container_name: droneshop-postgres-b
    restart: unless-stopped
    environment:
      POSTGRES_DB: droneshopdb
      POSTGRES_USER: droneshop_user
      POSTGRES_PASSWORD: "123456"
    ports:
      - "5433:5432"
    volumes:
      - droneshop-postgres-b-data:/var/lib/postgresql/data

  # Armazenamento S3 das mídias (D42, #95). API em 9000, console em http://localhost:9001.
  # Usuário e senha só de desenvolvimento local, trocáveis por variável de ambiente.
  # Cada trilha usa o próprio bucket (AERIA_S3_BUCKET), criado pela API na subida.
  rustfs:
    image: docker.io/rustfs/rustfs:1.0.5
    container_name: droneshop-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AERIA_S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${AERIA_S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - droneshop-rustfs-data:/data

volumes:
  droneshop-postgres-data:
  droneshop-postgres-b-data:
  droneshop-rustfs-data:
