name: Tarefa de domínio
description: Implementar uma classe (ou um grupo coeso de classes) do diagrama de classes.
title: "[modulo] Classe: resumo da entrega"
labels: ["tipo:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Uma issue = uma branch = um PR para a `develop`.
        Branch: botão "Create a branch" desta issue, com origem na `develop`.
        Trabalho em paralelo: escolha a trilha pelo dono do módulo (`docs/agentes/README.md`) e acrescente a etiqueta `trilha:a` ou `trilha:b`.

  - type: dropdown
    id: modulo
    attributes:
      label: Módulo
      options:
        - identidade
        - catalogo
        - estoque
        - compra
        - pagamento
        - pedido
        - devolucao
        - atendimento
        - notificacao
        - administracao
    validations:
      required: true

  - type: input
    id: classes
    attributes:
      label: Classes do diagrama
      description: Classes e enums que esta tarefa cria ou altera.
      placeholder: "GrupoProduto"
    validations:
      required: true

  - type: dropdown
    id: diagrama
    attributes:
      label: Diagrama de referência
      options:
        - docs/diagramas/aeria-identidade.puml
        - docs/diagramas/aeria-catalogo.puml
        - docs/diagramas/aeria-estoque.puml
        - docs/diagramas/aeria-compra.puml
        - docs/diagramas/aeria-pedido.puml
        - docs/diagramas/aeria-pagamento.puml
        - docs/diagramas/aeria-atendimento.puml
        - docs/diagramas/aeria-administrativo.puml
    validations:
      required: true

  - type: input
    id: refs
    attributes:
      label: Requisitos, regras e decisões (PRD)
      placeholder: "RF03, RF11, RN18, D13, D16"

  - type: textarea
    id: descricao
    attributes:
      label: O que entregar
      description: Atributos, relacionamentos e comportamento esperado, conforme o diagrama.
    validations:
      required: true

  - type: textarea
    id: contrato
    attributes:
      label: Contrato de API
      description: >-
        Base dos testes da issue. Para cada rota: método, caminho, corpo de entrada,
        resposta de sucesso e erros esperados. Erros seguem o formato Problem
        (400 validação, 404 não encontrado, 409 em uso).
      value: |
        ```
        POST /recurso
        {
          "campo": "valor"
        }
        -> 200 { "id": 1, "campo": "valor" }
        -> 400 errors[].field = "campo"
        ```

  - type: textarea
    id: prototipo
    attributes:
      label: Protótipo
      description: Tela(s) do protótipo que esta issue implementa (link do `docs/design/README.md`). Deixe em branco se não tiver tela.
      placeholder: "admin/marcas.html, admin/marca-nova.html"

  - type: checkboxes
    id: backend
    attributes:
      label: Backend (padrão SGA)
      options:
        - label: Entidade herdando `DefaultEntity` (`id`, `dataCadastro`, `dataAlteracao`)
        - label: Enums com id e nome, conversor JPA e rota de leitura (D31)
        - label: Repository (`PanacheRepository`)
        - label: '`XxxRequestDTO` e `XxxResponseDTO` como `record`, Bean Validation na entrada e mapper'
        - label: Service com `@Transactional` e validações de negócio
        - label: Resource REST com `page`/`pageSize` e resposta `PageResponse`
        - label: Erros no formato Problem (400, 404, 409, 503)
        - label: Carga de dados no arquivo da trilha (`import-a.sql` ou `import-b.sql`), sem id fixo
        - label: Diagrama `.puml` atualizado, se o modelo mudou
        - label: 'Testes de API com `@Tag("issue-<numero>")` e etiqueta em `backend/src/test/issues-entregues.txt`'

  - type: checkboxes
    id: frontend
    attributes:
      label: Frontend
      options:
        - label: Tela(s) do admin integradas à API
        - label: Tela(s) do storefront integradas à API
        - label: 'Conformidade com o protótipo passando (`npm run e2e -- --grep @issue-<numero>`) e etiqueta em `frontend/e2e/telas-entregues.txt`'
        - label: Rota da tela igual à de `frontend/e2e/conformidade/telas.ts`
        - label: Specs (`*.spec.ts`) dos services novos
        - label: Não se aplica

  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      value: |
        - [ ] 
    validations:
      required: true

  - type: input
    id: deps
    attributes:
      label: Depende de
      placeholder: "#12, #13"
