name: Cria branch da issue

# Cria a branch da issue já no padrão exigido pela "Política de branches":
#   tipo/<numero-da-issue>-<resumo>   (ex.: feat/12-variante-produto)
# A branch sai da develop e fica vinculada à issue (aparece em "Development"),
# como se tivesse sido criada pelo botão "Create a branch" — que não deve mais ser usado,
# porque ele gera <numero>-<titulo> sem tipo e com acentos.
#
# O tipo vem do label da issue (tipo:feature -> feat, tipo:bug -> fix, ...).
# Para uma issue que já existia, rode manualmente em Actions > "Cria branch da issue".

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Número da issue
        required: true
        type: number

permissions:
  contents: write
  issues: write

# Abrir uma issue com label dispara "opened" e "labeled" juntos; a fila evita branch duplicada.
concurrency:
  group: criar-branch-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  criar-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Cria branch tipo/<numero>-<resumo> a partir da develop
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        with:
          script: |
            const BASE = 'develop';
            const TAMANHO_MAX_RESUMO = 40;
            const TIPOS = {
              'tipo:feature': 'feat',
              'tipo:feat': 'feat',
              'tipo:bug': 'fix',
              'tipo:fix': 'fix',
              'tipo:docs': 'docs',
              'tipo:refactor': 'refactor',
              'tipo:test': 'test',
              'tipo:chore': 'chore',
            };

            const { owner, repo } = context.repo;
            const number = Number(process.env.ISSUE_NUMBER);

            const { repository } = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  id
                  issue(number: $number) {
                    id
                    title
                    state
                    labels(first: 20) { nodes { name } }
                    linkedBranches(first: 10) { nodes { ref { name } } }
                  }
                }
              }`, { owner, repo, number });

            const issue = repository.issue;
            if (!issue) return core.setFailed(`Issue #${number} não encontrada.`);
            if (issue.state !== 'OPEN') return core.info(`Issue #${number} está fechada; nada a fazer.`);

            // Já tem branch vinculada (pelo workflow ou criada à mão)? Não cria outra.
            const vinculadas = issue.linkedBranches.nodes.map(n => n.ref?.name).filter(Boolean);
            if (vinculadas.length) return core.info(`Issue #${number} já tem branch: ${vinculadas.join(', ')}`);

            const label = issue.labels.nodes.map(l => l.name).find(n => n in TIPOS);
            if (!label) {
              if (context.eventName !== 'labeled') {
                await github.rest.issues.createComment({ owner, repo, issue_number: number,
                  body: `Adicione um label de tipo (${Object.keys(TIPOS).map(t => '`' + t + '`').join(', ')}) ` +
                        `para a branch ser criada automaticamente.` });
              }
              return core.info('Issue sem label de tipo; branch não criada.');
            }
            const tipo = TIPOS[label];

            // "[catalogo] Atualizar diagrama: endereço" -> "atualizar-diagrama-endereco"
            let resumo = issue.title
              .replace(/^\s*\[[^\]]*\]\s*/, '')                     // tira o prefixo [modulo]
              .normalize('NFD').replace(/[̀-ͯ]/g, '')     // tira acentos (ç -> c, é -> e)
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');
            if (resumo.length > TAMANHO_MAX_RESUMO) {
              resumo = resumo.slice(0, TAMANHO_MAX_RESUMO);
              const corte = resumo.lastIndexOf('-');
              if (corte > 10) resumo = resumo.slice(0, corte);
            }
            if (!resumo) resumo = 'issue';                          // título só com símbolos
            const nome = `${tipo}/${number}-${resumo}`;

            // Mesma regex da politica-de-branches.yml: se divergir, falha aqui e não no PR.
            if (!/^(feat|fix|docs|refactor|test|chore)\/[0-9]+-[a-z0-9._-]+$/.test(nome)) {
              return core.setFailed(`Nome gerado fora do padrão: ${nome}`);
            }

            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${BASE}` });

            await github.graphql(`
              mutation($issueId: ID!, $repositoryId: ID!, $oid: GitObjectID!, $name: String!) {
                createLinkedBranch(input: { issueId: $issueId, repositoryId: $repositoryId, oid: $oid, name: $name }) {
                  linkedBranch { ref { name } }
                }
              }`, { issueId: issue.id, repositoryId: repository.id, oid: ref.object.sha, name: nome });

            await github.rest.issues.createComment({ owner, repo, issue_number: number,
              body: [
                `Branch criada a partir da \`${BASE}\`: \`${nome}\``,
                '',
                '```bash',
                'git fetch origin',
                `git switch ${nome}`,
                '```',
              ].join('\n') });

            core.info(`Branch ${nome} criada e vinculada à issue #${number}.`);
