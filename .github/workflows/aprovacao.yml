name: Aprovação

# Check "aprovacao-do-davi", obrigatório nos rulesets da main e da develop.
# Substitui a regra de aprovação do GitHub, que não deixa o autor aprovar o próprio PR:
#   - PR aberto pelo Davi: passa direto.
#   - PR de outra pessoa: só passa quando o Davi aprovou o último commit do PR.
#     Commit novo depois da aprovação faz o check falhar de novo até ele aprovar outra vez.
#
# pull_request_target roda a versão deste arquivo que está na branch de destino.
# O gatilho pull_request_review (quando o Davi aprova) roda a versão do PR: por isso,
# PR de outra pessoa que mexe em .github/ precisa ser lido com atenção antes de aprovar.
# Nenhum código do PR é baixado nem executado aqui.

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

concurrency:
  group: aprovacao-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aprovacao-do-davi:
    runs-on: ubuntu-latest
    steps:
      - name: Autor é o Davi ou o Davi aprovou o último commit
        uses: actions/github-script@v7
        with:
          script: |
            const APROVADOR = 'DaviRSuassuna';
            const pr = context.payload.pull_request;

            if (pr.user.login === APROVADOR) {
              return core.info(`PR aberto por ${APROVADOR}: aprovação não exigida.`);
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });

            // Última review do Davi que muda o estado (comentários soltos não contam).
            const ultima = reviews
              .filter(r => r.user?.login === APROVADOR && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state))
              .pop();

            if (ultima?.state === 'APPROVED' && ultima.commit_id === pr.head.sha) {
              return core.info(`Aprovado por ${APROVADOR} no commit ${pr.head.sha.slice(0, 7)}.`);
            }

            const motivo = !ultima ? 'ainda não revisou'
              : ultima.state !== 'APPROVED' ? `última revisão: ${ultima.state}`
              : 'aprovou um commit anterior; há commits novos';
            core.setFailed(`Falta a aprovação de ${APROVADOR} (${motivo}).`);
