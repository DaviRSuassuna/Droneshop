name: Aprovação

# Check "aprovacao", obrigatório nos rulesets da main e da develop.
# Substitui a regra de aprovação do GitHub, que não deixa o autor aprovar o próprio PR.
# O aprovador é o dono do repositório:
#   - PR aberto pelo dono: passa direto.
#   - PR de outra pessoa: só passa quando o dono aprovou o último commit do PR.
#     Commit novo depois da aprovação faz o check falhar de novo até ele aprovar outra vez.
#
# pull_request_target roda a versão deste arquivo que está na branch de destino.
# O gatilho pull_request_review (quando o dono aprova) roda a versão do PR: por isso,
# PR de outra pessoa que mexe em .github/ precisa ser lido com atenção antes de aprovar.
# Nenhum código do PR é baixado nem executado aqui.

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

concurrency:
  group: aprovacao-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  aprovacao:
    runs-on: ubuntu-latest
    steps:
      - name: Autor é o dono do repositório ou o dono aprovou o último commit
        uses: actions/github-script@v7
        with:
          script: |
            const aprovador = context.repo.owner;
            const pr = context.payload.pull_request;

            if (pr.user.login === aprovador) {
              return core.info('PR aberto pelo dono do repositório: aprovação não exigida.');
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner, repo: context.repo.repo, pull_number: pr.number,
            });

            // Última review do dono que muda o estado (comentários soltos não contam).
            const ultima = reviews
              .filter(r => r.user?.login === aprovador && ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state))
              .pop();

            if (ultima?.state === 'APPROVED' && ultima.commit_id === pr.head.sha) {
              return core.info(`Aprovado no commit ${pr.head.sha.slice(0, 7)}.`);
            }

            const motivo = !ultima ? 'ainda não revisado'
              : ultima.state !== 'APPROVED' ? `última revisão: ${ultima.state}`
              : 'aprovação de um commit anterior; há commits novos';
            core.setFailed(`Falta a aprovação do dono do repositório (${motivo}).`);
