name: Política de branches

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  origem-da-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Valida origem, nome da branch e issue vinculada
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ]; then
              echo "::error::A main só recebe PR vindo da develop (origem atual: $HEAD)."
              exit 1
            fi
            echo "PR develop -> main: ok"
            exit 0
          fi

          # BASE = develop
          # O número da issue no nome da branch é opcional: tipo/<numero>-<resumo> ou tipo/<resumo>.
          if ! [[ "$HEAD" =~ ^(feat|fix|docs|refactor|test|chore|ci)/([0-9]+-)?[a-z0-9._-]+$ ]]; then
            echo "::error::Branch '$HEAD' fora do padrão tipo/<resumo> ou tipo/<numero-da-issue>-<resumo> (ex.: feat/12-variante-produto, chore/ajusta-gitignore)."
            exit 1
          fi

          # Vincular issue é opcional: sem 'Closes #<numero>' o check passa, só com aviso.
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "::notice::PR sem issue vinculada. Se ele resolve uma issue, adicione 'Closes #<numero>' na descrição."
          fi

          echo "PR $HEAD -> develop: ok"
