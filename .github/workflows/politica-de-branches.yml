name: Política de branches

on:
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  origem-da-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Valida origem, nome da branch e issue vinculada
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [ "$BASE" = "main" ]; then
            if [ "$HEAD" != "develop" ]; then
              echo "::error::A main só recebe PR vindo da develop (origem atual: $HEAD)."
              exit 1
            fi
            echo "PR develop -> main: ok"
            exit 0
          fi

          # BASE = develop
          if ! [[ "$HEAD" =~ ^(feat|fix|docs|refactor|test|chore)/[0-9]+-[a-z0-9._-]+$ ]]; then
            echo "::error::Branch '$HEAD' fora do padrão tipo/<numero-da-issue>-<resumo> (ex.: feat/12-variante-produto)."
            exit 1
          fi

          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "::error::A descrição do PR precisa vincular a issue com 'Closes #<numero>'."
            exit 1
          fi

          echo "PR $HEAD -> develop: ok"
